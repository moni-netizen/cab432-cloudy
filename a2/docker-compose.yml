services:
  mcp-server:
    build:
      context: ./mcp_server
    volumes:
     - ${USERPROFILE}\.aws:/home/appuser/.aws:ro 
    networks:
     - internal

  agent-app:
    build:
      context: .
      dockerfile: Dockerfile 
    ports:
      - "3000:3000"
    environment:
      - MCP_SERVER_URL=http://mcp-server:8000/mcp
      - AWS_REGION=ap-southeast-2
    volumes:
      - ${USERPROFILE}\.aws:/home/appuser/.aws:ro
    depends_on:
      - mcp-server
    networks:
      - internal
      - public

  frontend:
    build:
      context: ./acp_client
    ports:
      - "80:80"
    networks:
      - public

networks:
  internal:
  public: