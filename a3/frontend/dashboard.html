<!doctype html>
<html lang="en" class="checking">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      .charts { display: flex; gap: 24px; flex-wrap: wrap; }
      .chart-box { flex: 1 1 260px; }
      .chart-box h3 { margin: 0 0 8px; font-weight: 500; }
      .chart-div { width: 100%; height: 340px; }
    </style>
  </head>
  <body class="dash">
    <aside class="dash-side">
      <p class="dash-title">welcome to dashboard</p>
      <nav class="dash-nav"><a class="btn" href="/forum.html">Forum</a><a class="btn" href="/chat.html">Chatbot</a>
      </nav>
      <button id="logout" type="button" class="link">Log out</button>
    </aside>
    <main class="dash-main">
      <h2>recently played</h2>
      <div class="charts">
        <div class="chart-box">
          <h3>all games</h3>
          <div class="chart-div"><canvas id="allGamesChart"></canvas></div>
        </div>
        <div class="chart-box">
          <h3>last 2 weeks</h3>
          <div class="chart-div"><canvas id="recentGamesChart"></canvas></div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/dashboard.ts"></script>
  </body>
</html>
