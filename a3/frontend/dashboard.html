<!doctype html>
<html lang="en" class="checking">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      /* sidebar */
      .profile-card { background: #e977cf; padding: 24px; margin: 16px 0; }
      .avatar { background: #97b9ec; aspect-ratio: 1 / 1; width: 100%; margin-bottom: 16px; }
      .profile-card p { margin: 4px 0; font-size: 1.1rem; }
      .dash-nav { display: flex; flex-direction: column; gap: 16px; }
      .dash-nav .btn { background: #97b9ec; padding: 14px 10px; color: #000; text-decoration: none; }

      /* charts */
      .charts { display: flex; gap: 24px; flex-wrap: wrap; }
      .chart-box { flex: 1 1 260px; }
      .chart-box h3 { margin: 0 0 8px; font-weight: 500; }
      .chart-div { width: 100%; height: 200px; }

      /* recently updated slider */
      .games-section { margin-top: 24px; }
      .slider { display: flex; align-items: center; gap: 8px; }
      .slider-btn { flex: none; border: 0; background: #97b9ec; width: 36px; height: 36px;
                    border-radius: 50%; cursor: pointer; font-size: 1.2rem; }
      .games-track { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory;
                     padding: 8px 4px; flex: 1; scrollbar-width: thin; }
      .game-card { flex: none; width: 200px; scroll-snap-align: start; }
      .game-card img { width: 100%; aspect-ratio: 460 / 215; object-fit: cover; display: block;
                       background: #ddd; }
      .game-name { margin: 6px 0 0; font-size: 0.9rem; text-align: center;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
  </head>
  <body class="dash">
    <aside class="dash-side">
      <p class="dash-credit">made by monique soth<br />N12023868</p>

      <div class="profile-card">
        <div class="avatar"></div>
        <p id="profileName">name:</p>
        <p id="profileSteam">steam ID: not yet implemented</p>
      </div>

      <nav class="dash-nav">
        <a class="btn" href="/forum.html">forum</a>
        <a class="btn" href="/chat.html">chat bot</a>
        <div class="btn">achievements</div>
      </nav>

      <button id="logout" type="button" class="link">Log out</button>
    </aside>

    <main class="dash-main">
      <h1 id="hello">hello, user!</h1>
      <p>track your progression</p>

      <div class="charts">
        <div class="chart-box">
          <h3>all time</h3>
          <div class="chart-div"><canvas id="allGamesChart"></canvas></div>
        </div>
        <div class="chart-box">
          <h3>recently played</h3>
          <div class="chart-div"><canvas id="recentGamesChart"></canvas></div>
        </div>
      </div>

            <section class="games-section">
        <h2>recently updated games</h2>
        <div id="gamesTrack" class="games-track"></div>
      </section>

    </main>
    <script type="module" src="/src/dashboard.ts"></script>
  </body>
</html>
