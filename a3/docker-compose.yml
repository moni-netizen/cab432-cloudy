services:
  mcp-server:
    build:
      context: ./mcp_server
    volumes:
     - ${USERPROFILE}\.aws:/home/appuser/.aws
    networks:
     - internal

  agent-app:
    build:
      context: .
      dockerfile: Dockerfile 
    ports:
      - "8080:8080"
    environment:
      - AWS_REGION=ap-southeast-2
    volumes:
      - ${USERPROFILE}\.aws:/home/appuser/.aws
    depends_on:
      - mcp-server
    networks:
      - internal
      - public

networks:
  internal:
  public: